[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-web-installer"
version = "0.3.0"
description = "Ubuntu robot DEB deployment desktop tool"
requires-python = ">=3.10"
dependencies = [
  "PySide6-Essentials==6.8.3",
  "paramiko==3.5.1",
  "requests==2.32.5",
  "cryptography==44.0.3",
  "bcrypt==4.3.0",
  "PyNaCl==1.5.0",
  "pyte==0.8.2",
  "wcwidth==0.2.13",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.7", "pyinstaller==6.16.0"]

[project.scripts]
robot-web-installer = "robot_installer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_installer = ["remote/*.sh", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
